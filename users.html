<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manage Users — Lab Asset System</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="topbar">
    <div class="brand">Lab Asset &amp; Service Management</div>
    <div class="user-info">
      <span id="nav-user-name"></span>
      <span class="role-badge" id="nav-user-role"></span>
      <button onclick="logout()">Log Out</button>
    </div>
  </div>
  <div class="layout">
    <nav class="sidebar" id="sidebar-links"></nav>
    <main class="content">
      <h1>Manage Users</h1>
      <p class="muted">
        Administrator only. New sign-ups default to <strong>Requester</strong>;
        promote or demote accounts here. You cannot change your own role
        (prevents an admin from accidentally locking themselves out).
      </p>
      <div id="alert-area"></div>

      <div class="card">
        <table>
          <thead><tr><th>Name</th><th>Current Role</th><th>Joined</th><th>Change Role</th></tr></thead>
          <tbody id="users-body"><tr><td colspan="4">Loading...</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let currentProfile = null;
    const ROLES = ["administrator", "staff", "requester"];

    function showAlert(msg, type) {
      document.getElementById("alert-area").innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
    }

    async function loadUsers() {
      const { data, error } = await supabaseClient
        .from("profiles")
        .select("id, full_name, role, created_at")
        .order("created_at");

      const body = document.getElementById("users-body");
      if (error) { body.innerHTML = `<tr><td colspan="4">Error: ${error.message}</td></tr>`; return; }
      if (!data.length) { body.innerHTML = `<tr><td colspan="4">No users found.</td></tr>`; return; }

      body.innerHTML = data.map(u => {
        const isSelf = u.id === currentProfile.id;
        const options = ROLES.map(r => `<option value="${r}" ${r === u.role ? "selected" : ""}>${r}</option>`).join("");
        return `<tr>
          <td>${u.full_name} ${isSelf ? "<em>(you)</em>" : ""}</td>
          <td><span class="role-badge" style="background:#2f5788;">${u.role}</span></td>
          <td>${new Date(u.created_at).toLocaleDateString()}</td>
          <td>
            ${isSelf
              ? `<span class="muted">Cannot change your own role</span>`
              : `<select id="role-select-${u.id}">${options}</select>
                 <button class="btn small" onclick="changeRole('${u.id}')">Update</button>`}
          </td>
        </tr>`;
      }).join("");
    }

    async function changeRole(userId) {
      const newRole = document.getElementById(`role-select-${userId}`).value;
      const { error } = await supabaseClient.rpc("promote_user", {
        p_user_id: userId, p_new_role: newRole
      });
      showAlert(error ? error.message : `Role updated to "${newRole}".`, error ? "error" : "success");
      loadUsers();
    }

    (async () => {
      currentProfile = await requireRole(["administrator"]);
      if (!currentProfile) return;
      loadUsers();
    })();
  </script>
</body>
</html>
