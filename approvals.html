<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Approvals — Lab Asset System</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="topbar">
    <div class="brand">Lab Asset &amp; Service Management</div>
    <div class="user-info">
      <span id="nav-user-name"></span>
      <span class="role-badge" id="nav-user-role"></span>
      <button onclick="logout()">Log Out</button>
    </div>
  </div>
  <div class="layout">
    <nav class="sidebar" id="sidebar-links"></nav>
    <main class="content">
      <h1>Pending Approvals</h1>
      <p class="muted">Administrator only. Staff/Admin cannot approve their own request (BR-A4-02).</p>
      <div id="alert-area"></div>
      <div class="card">
        <table>
          <thead><tr><th>ID</th><th>Equipment</th><th>Requester</th><th>Purpose</th><th>Requested</th><th></th></tr></thead>
          <tbody id="pending-body"><tr><td colspan="6">Loading...</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let currentProfile = null;

    function showAlert(msg, type) {
      document.getElementById("alert-area").innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
    }

    async function loadPending() {
      const { data, error } = await supabaseClient
        .from("borrowing_requests")
        .select("id, purpose, requested_at, requester_id, equipment(name, code), profiles!borrowing_requests_requester_id_fkey(full_name)")
        .eq("status", "Pending")
        .order("requested_at");

      const body = document.getElementById("pending-body");
      if (error) { body.innerHTML = `<tr><td colspan="6">Error: ${error.message}</td></tr>`; return; }
      if (!data.length) { body.innerHTML = `<tr><td colspan="6">No pending requests.</td></tr>`; return; }

      body.innerHTML = data.map(r => {
        const isOwn = r.requester_id === currentProfile.id;
        return `<tr>
          <td>#${r.id}</td>
          <td>${r.equipment ? r.equipment.name + " (" + r.equipment.code + ")" : r.equipment_id}</td>
          <td>${r.profiles ? r.profiles.full_name : "-"} ${isOwn ? "<em>(you)</em>" : ""}</td>
          <td>${r.purpose}</td>
          <td>${new Date(r.requested_at).toLocaleString()}</td>
          <td>
            ${isOwn
              ? `<span class="muted">Cannot approve own request</span>`
              : `<button class="btn small approve" onclick="approve(${r.id})">Approve</button>
                 <button class="btn small reject" onclick="reject(${r.id})">Reject</button>`}
          </td>
        </tr>`;
      }).join("");
    }

    async function approve(id) {
      const { error } = await supabaseClient.rpc("approve_request", { p_request_id: id });
      showAlert(error ? error.message : `Request #${id} approved.`, error ? "error" : "success");
      loadPending();
    }

    async function reject(id) {
      const reason = prompt("Reason for rejection (optional):") || null;
      const { error } = await supabaseClient.rpc("reject_request", { p_request_id: id, p_reason: reason });
      showAlert(error ? error.message : `Request #${id} rejected.`, error ? "error" : "success");
      loadPending();
    }

    (async () => {
      currentProfile = await requireRole(["administrator"]);
      if (!currentProfile) return;
      loadPending();
    })();
  </script>
</body>
</html>
